# Supabase stack used only by the E2E suite (`pnpm e2e:db:start`).
# Separate project_id and 573xx ports so it never collides with the app's own
# local stack (5432x) or other projects running on this machine.
project_id = "bcsseattle-e2e"

[api]
enabled = true
port = 57321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 57322
shadow_port = 57320
# Matches production (dump taken with postgres 15.1).
major_version = 15

[db.pooler]
enabled = false
port = 57329

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 57323

[inbucket]
enabled = true
port = 57324
# The contact form's mail goes here (SMTP_URL in e2e/.env.e2e).
smtp_port = 57325

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.candidate-photos]
public = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3100"
additional_redirect_urls = ["http://localhost:3100/**", "http://127.0.0.1:3100/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

# Raised well above production so a parallel suite doesn't trip them.
[auth.rate_limit]
email_sent = 1000
sms_sent = 1000
anonymous_users = 1000
token_refresh = 10000
sign_in_sign_ups = 10000
token_verifications = 10000

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[analytics]
enabled = false
port = 57327

[edge_runtime]
enabled = false
inspector_port = 57083
